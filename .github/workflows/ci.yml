name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore PersonalFinanceManager.sln

      - name: Build (all projects)
        run: dotnet build PersonalFinanceManager.sln --no-restore --configuration Release

      - name: Unit Tests
        run: >
          dotnet test PersonalFinanceManager.UnitTests/PersonalFinanceManager.UnitTests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"

      - name: Integration Tests
        run: >
          dotnet test PersonalFinanceManager.IntegrationTests/PersonalFinanceManager.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
