name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Cross-platform build + test (Core, Application, Web, API, unit + integration tests) ──
  build-and-test:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        # Exclude the WPF Desktop projects — they target net8.0-windows and won't restore on Linux.
        run: |
          dotnet restore PersonalFinanceManager.Core/PersonalFinanceManager.Core.csproj
          dotnet restore PersonalFinanceManager.Application.Contracts/PersonalFinanceManager.Application.Contracts.csproj
          dotnet restore PersonalFinanceManager.Application/PersonalFinanceManager.Application.csproj
          dotnet restore PersonalFinanceManager.Infrastructure/PersonalFinanceManager.Infrastructure.csproj
          dotnet restore PersonalFinanceManager.API/PersonalFinanceManager.API.csproj
          dotnet restore PersonalFinanceManager.Web/PersonalFinanceManager.Web.csproj
          dotnet restore PersonalFinanceManager.UnitTests/PersonalFinanceManager.UnitTests.csproj
          dotnet restore PersonalFinanceManager.IntegrationTests/PersonalFinanceManager.IntegrationTests.csproj

      - name: Build (non-Windows projects)
        run: |
          dotnet build PersonalFinanceManager.Core/PersonalFinanceManager.Core.csproj --no-restore --configuration Release
          dotnet build PersonalFinanceManager.Application.Contracts/PersonalFinanceManager.Application.Contracts.csproj --no-restore --configuration Release
          dotnet build PersonalFinanceManager.Application/PersonalFinanceManager.Application.csproj --no-restore --configuration Release
          dotnet build PersonalFinanceManager.Infrastructure/PersonalFinanceManager.Infrastructure.csproj --no-restore --configuration Release
          dotnet build PersonalFinanceManager.API/PersonalFinanceManager.API.csproj --no-restore --configuration Release
          dotnet build PersonalFinanceManager.Web/PersonalFinanceManager.Web.csproj --no-restore --configuration Release
          dotnet build PersonalFinanceManager.UnitTests/PersonalFinanceManager.UnitTests.csproj --no-restore --configuration Release
          dotnet build PersonalFinanceManager.IntegrationTests/PersonalFinanceManager.IntegrationTests.csproj --no-restore --configuration Release

      - name: Unit Tests
        run: >
          dotnet test PersonalFinanceManager.UnitTests/PersonalFinanceManager.UnitTests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"

      - name: Integration Tests
        run: >
          dotnet test PersonalFinanceManager.IntegrationTests/PersonalFinanceManager.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"

  # ── Windows build + Desktop tests (WPF requires Windows) ──
  desktop-tests:
    name: Desktop Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore Desktop projects
        run: |
          dotnet restore PersonalFinanceManager.Desktop/PersonalFinanceManager.Desktop.csproj
          dotnet restore PersonalFinanceManager.Desktop.Tests/PersonalFinanceManager.Desktop.Tests.csproj

      - name: Build Desktop projects
        run: |
          dotnet build PersonalFinanceManager.Desktop/PersonalFinanceManager.Desktop.csproj --no-restore --configuration Release
          dotnet build PersonalFinanceManager.Desktop.Tests/PersonalFinanceManager.Desktop.Tests.csproj --no-restore --configuration Release

      - name: Desktop Sync Tests
        run: >
          dotnet test PersonalFinanceManager.Desktop.Tests/PersonalFinanceManager.Desktop.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"

  # ── Mobile (Android/MAUI) build + tests ──
  # Note: PersonalFinanceManager.Mobile itself is net9.0-android and currently
  # cannot restore on this corporate feed — see docs/ROADMAP.md Phase 6a
  # (Xamarin.AndroidX.*/Xamarin.Google.* packages are absent from the feed and
  # nuget.org is blocked on this network). The Mobile.csproj build step below
  # is expected to fail restore until that's resolved; Mobile.Tests (plain
  # net9.0, no Android workload needed) is unaffected and should pass.
  mobile:
    name: Mobile (Android) Build + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Mobile
        run: dotnet restore PersonalFinanceManager.Mobile/PersonalFinanceManager.Mobile.csproj
        continue-on-error: true

      - name: Build Mobile
        run: dotnet build PersonalFinanceManager.Mobile/PersonalFinanceManager.Mobile.csproj --configuration Release
        continue-on-error: true

      - name: Restore Mobile.Tests
        run: dotnet restore PersonalFinanceManager.Mobile.Tests/PersonalFinanceManager.Mobile.Tests.csproj

      - name: Build Mobile.Tests
        run: dotnet build PersonalFinanceManager.Mobile.Tests/PersonalFinanceManager.Mobile.Tests.csproj --no-restore --configuration Release

      - name: Mobile Tests
        run: >
          dotnet test PersonalFinanceManager.Mobile.Tests/PersonalFinanceManager.Mobile.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
